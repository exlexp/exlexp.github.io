name: release-preparation
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  unsigned-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run bundle:iwa
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: relayless-unsigned-${{ github.ref_name }}
          path: |
            dist/relayless.wbn
            dist/SHA256SUMS
          if-no-files-found: error

# Signing is intentionally absent. Download the unsigned artifact, rebuild if
# desired, and sign locally with the offline key described in BUILDING.md.
